openapi: 3.0.3
info:
  title: 智汇于庄 (Zhihui Yuzhuang) - Core Service OpenAPI Contract
  version: 1.0.0
  description: 包含 Spring Boot 业务中台 (特产交易下单) 与 FastAPI AI 服务 (农技知识 RAG 问答) 的核心标准契约。
servers:
  - url: http://localhost/api/v1
    description: Spring Boot 业务后端网关前缀
  - url: http://localhost/ai/v1
    description: FastAPI 智能农技后端网关前缀

paths:
  # ==========================================
  # 认证接口 (Spring Boot · JWT)
  # ==========================================
  /auth/login:
    post:
      summary: 用户登录（用户名/密码换取 JWT）
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
      responses:
        '200':
          description: 登录成功，返回访问令牌与用户信息
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/AuthLoginResponse'
        '401':
          description: 用户名或密码错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
                example:
                  code: "A1002"
                  message: "用户名或密码错误"
                  data: null
                  timestamp: 1725437380000
                  requestId: "req-err-001"

  # ==========================================
  # 商品管理写接口 (Spring Boot)
  # ==========================================
  /products:
    post:
      summary: 上架新商品
      operationId: createProduct
      description: 需要 JWT；商品归属租户取令牌 tenantId（COOPERATIVE/VILLAGE 可写；global 目录仅 VILLAGE 可维护）。
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpsertRequest'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ProductSkuResponse'
        '409':
          $ref: '#/components/responses/StandardErrorResponse'

  /products/{id}:
    put:
      summary: 编辑商品
      operationId: updateProduct
      description: 需要 JWT；仅可编辑本租户商品（跨租户返回 404 + A1004；global 目录仅 VILLAGE 可维护）。
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpsertRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ProductSkuResponse'
        '404':
          $ref: '#/components/responses/StandardErrorResponse'

  /products/{id}/status:
    patch:
      summary: 商品上下架切换
      operationId: updateProductStatus
      description: 需要 JWT；仅可操作本租户商品（跨租户返回 404 + A1004）。
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductStatusRequest'
      responses:
        '200':
          description: 切换成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ProductSkuResponse'
        '404':
          $ref: '#/components/responses/StandardErrorResponse'

  # ==========================================
  # 特产下单接口 (Spring Boot)
  # ==========================================
  /orders/checkout:
    post:
      summary: 特产商品下单（支持并发削峰与幂等保障）
      operationId: createSpecialtyOrder
      description: 公开匿名下单；X-Tenant-Id 表示卖货店铺/合作社租户，X-Idempotency-Key 防重复提交。
      parameters:
        - in: header
          name: X-Tenant-Id
          required: true
          schema:
            type: string
            example: "tenant_yuzhuang_001"
          description: 合作社/行政村多租户标识
        - in: header
          name: X-Idempotency-Key
          required: true
          schema:
            type: string
            example: "idem_8f7b2c9d-1234"
          description: 前端生成的唯一幂等键，防止秒杀重复点击
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCheckoutRequest'
      responses:
        '200':
          description: 下单成功或已接受排队
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/OrderCheckoutResponse'
        '400':
          $ref: '#/components/responses/StandardErrorResponse'
        '409':
          description: 库存不足或并发幂等冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
                example:
                  code: "B2001"
                  message: "抱歉，该批次特产库存不足"
                  data: null
                  timestamp: 1725437380000
                  requestId: "req-err-001"

  # ==========================================
  # 订单查询聚合接口 (Spring Boot)
  # ==========================================
  /orders:
    get:
      summary: 分页查询当前租户订单列表
      operationId: listOrders
      description: 需要 JWT；数据范围限定为令牌 tenantId 所属租户（任意已认证角色可读）。
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: 页码（从 1 开始）
        - in: query
          name: pageSize
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          description: 每页条数（1~100）
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [PENDING_PAY, STOCK_CONFIRMED, PROCESSING, CANCELLED, COMPLETED]
          description: 按订单状态过滤（可选）
        - in: query
          name: orderSource
          required: false
          schema:
            type: string
            enum: [H5_PRIVATE, DOUYIN, KUAISHOU, B2B_PORTAL]
          description: 按渠道来源过滤（可选）
        - in: query
          name: fulfillmentStatus
          required: false
          schema:
            type: string
            enum: [PENDING, PICKING, READY, SHIPPED, ABNORMAL]
          description: 按履约状态过滤（可选，B 端履约看板使用）
        - in: query
          name: keyword
          required: false
          schema:
            type: string
            maxLength: 64
          description: 关键词（模糊匹配订单号/收货人，可选）
      responses:
        '200':
          description: 订单分页列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/PageResultOrderSummary'
        '400':
          $ref: '#/components/responses/StandardErrorResponse'

  /orders/{orderNo}:
    get:
      summary: 查询订单详情（含明细行）
      operationId: getOrderDetail
      description: 需要 JWT；数据范围限定为令牌 tenantId 所属租户，跨租户返回 404 + A1004。
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: orderNo
          required: true
          schema:
            type: string
          description: 业务订单号
      responses:
        '200':
          description: 订单详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/OrderDetailResponse'
        '404':
          $ref: '#/components/responses/StandardErrorResponse'

  /orders/{orderNo}/ship:
    post:
      summary: 订单一键出库（履约状态 READY → SHIPPED）
      operationId: shipOrder
      description: 需要 JWT；数据范围限定为令牌 tenantId 所属租户（COOPERATIVE/VILLAGE 可操作）。
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: orderNo
          required: true
          schema:
            type: string
          description: 业务订单号
      responses:
        '200':
          description: 出库成功，返回更新后的订单摘要（fulfillmentStatus=SHIPPED）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/OrderSummaryResponse'
        '404':
          $ref: '#/components/responses/StandardErrorResponse'
        '409':
          description: 订单非出库就绪（READY）状态或已出库，无法推进
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
                example:
                  code: "B2003"
                  message: "订单状态已更新，请刷新后重试"
                  data: null
                  timestamp: 1725437380000
                  requestId: "req-err-002"

  /orders/{orderNo}/mark-ready:
    post:
      summary: 拣货完成置为待出库（履约状态 PICKING → READY）
      operationId: markOrderReady
      description: 需要 JWT；数据范围限定为令牌 tenantId 所属租户（COOPERATIVE/VILLAGE 可操作）。
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: orderNo
          required: true
          schema:
            type: string
          description: 业务订单号
      responses:
        '200':
          description: 标记成功，返回更新后的订单摘要（fulfillmentStatus=READY）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/OrderSummaryResponse'
        '404':
          $ref: '#/components/responses/StandardErrorResponse'
        '409':
          description: 订单当前不是拣货中（PICKING）状态，无法置为待出库
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
                example:
                  code: "B2003"
                  message: "标记待出库失败：订单当前状态非拣货中，请刷新后重试"
                  data: null
                  timestamp: 1725437380000
                  requestId: "req-err-003"

  /orders/{orderNo}/recover:
    post:
      summary: 异常单恢复拣货（履约状态 ABNORMAL → PICKING）
      operationId: recoverAbnormalOrder
      description: 需要 JWT；数据范围限定为令牌 tenantId 所属租户（COOPERATIVE/VILLAGE 可操作）。
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: orderNo
          required: true
          schema:
            type: string
          description: 业务订单号
      responses:
        '200':
          description: 恢复成功，返回更新后的订单摘要（fulfillmentStatus=PICKING）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/OrderSummaryResponse'
        '404':
          $ref: '#/components/responses/StandardErrorResponse'
        '409':
          description: 订单当前不是异常（ABNORMAL）状态，无法恢复
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
                example:
                  code: "B2003"
                  message: "恢复拣货失败：订单当前状态非异常，请刷新后重试"
                  data: null
                  timestamp: 1725437380000
                  requestId: "req-err-004"

  # ==========================================
  # 支付闭环（演示沙箱 · 订单支付成功入账）
  # ==========================================
  /orders/{orderNo}/pay/sandbox:
    post:
      summary: 模拟支付成功（沙箱演示）
      operationId: sandboxPayOrder
      description: 需要 JWT（COOPERATIVE/VILLAGE）。将 STOCK_CONFIRMED → PROCESSING 并记录渠道流水号（幂等去重）：同渠道同流水号重复回放幂等成功，异流水号重复支付 409 + B2003；已关闭订单 404。
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: orderNo
          required: true
          schema:
            type: string
          description: 业务订单号
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentSandboxPayRequest'
      responses:
        '200':
          description: 支付成功入账（status=PROCESSING）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/PaymentSandboxResponse'
        '404':
          $ref: '#/components/responses/StandardErrorResponse'
        '409':
          description: 重复支付或当前状态不允许支付
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
                example:
                  code: "B2003"
                  message: "订单已支付，重复支付被拒绝"
                  data: null

  # ==========================================
  # 经营大盘聚合 (Spring Boot · 只读 · 需 JWT)
  # ==========================================
  /dashboard/summary:
    get:
      summary: 经营大盘汇总（合计 + 近7日趋势 + 商品销量 TOP）
      operationId: dashboardSummary
      description: 需要 JWT（任意已认证角色）。数据范围限定为令牌 tenantId 所属租户；交易额口径 = 非 CANCELLED 订单金额合计（含待支付锁定 GMV）。
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 聚合快照
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/DashboardSummaryResponse'
        '401':
          $ref: '#/components/responses/StandardErrorResponse'

  # ==========================================
  # 农技问答接口 (FastAPI + DeepSeek)
  # ==========================================
  /qa/ask:
    post:
      summary: 农技与惠农政策检索增强问答 (RAG)
      operationId: queryAgriTechQA
      parameters:
        - in: header
          name: X-Tenant-Id
          required: false
          schema:
            type: string
            default: "global"
          description: 可选的租户标识，用于限定属地化政策库
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgriQARequest'
      responses:
        '200':
          description: 问答成功并返回防幻觉引用来源
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/AgriQAResponse'
        '422':
          $ref: '#/components/responses/StandardErrorResponse'

  # ==========================================
  # 知识库管理 (FastAPI · 切片/向量入库 · 当前无身份校验，待 AI 治理阶段收敛)
  # ==========================================
  /knowledge/docs:
    get:
      summary: 列出知识文档（本租户 ∪ global，按入库时间倒序）
      operationId: listKnowledgeDocs
      parameters:
        - in: header
          name: X-Tenant-Id
          required: false
          schema:
            type: string
            default: "global"
          description: 租户标识（含 global 共享知识库）
      responses:
        '200':
          description: 文档元信息列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/KnowledgeDocItem'

    post:
      summary: 上传知识文档（.txt/.md → 切片 → 向量化入库）
      operationId: uploadKnowledgeDoc
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                tenant_id:
                  type: string
                  default: "global"
                category:
                  type: string
                  default: "GENERAL"
      responses:
        '200':
          description: 入库成功摘要
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/KnowledgeUploadResponse'
        '400':
          $ref: '#/components/responses/StandardErrorResponse'

  /knowledge/docs/delete:
    post:
      summary: 删除指定租户知识文档（幂等）
      operationId: deleteKnowledgeDoc
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KnowledgeDeleteRequest'
      responses:
        '200':
          description: 删除结果（deleted=已删切片行数）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/KnowledgeDeleteResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # 登录请求模型
    AuthLoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 2
          maxLength: 64
          example: "admin"
        password:
          type: string
          minLength: 6
          maxLength: 128
          example: "admin123"

    # 登录响应模型
    AuthLoginResponse:
      type: object
      required:
        - token
        - tokenType
        - expiresIn
        - user
      properties:
        token:
          type: string
          description: JWT 访问令牌（Authorization: Bearer <token>）
          example: "eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJhZG1pbiJ9.signature"
        tokenType:
          type: string
          enum: [Bearer]
          example: "Bearer"
        expiresIn:
          type: integer
          format: int64
          description: 令牌有效期（秒）
          example: 7200
        user:
          type: object
          properties:
            userId:
              type: integer
              format: int64
              example: 1
            username:
              type: string
              example: "admin"
            displayName:
              type: string
              example: "于庄村委管理员"
            tenantId:
              type: string
              example: "tenant_yuzhuang_001"
            role:
              type: string
              enum: [FARMER, COOPERATIVE, VILLAGE]
              example: "VILLAGE"

    # 商品上架/编辑请求模型
    ProductUpsertRequest:
      type: object
      required:
        - skuCode
        - spuName
        - price
        - stock
      properties:
        skuCode:
          type: string
          maxLength: 64
          example: "SKU1004"
        spuName:
          type: string
          maxLength: 255
          example: "于庄石磨黑芝麻香油"
        price:
          type: number
          format: double
          exclusiveMinimum: 0
          example: 58.00
        stock:
          type: integer
          minimum: 0
          example: 300
        status:
          type: string
          enum: [ON_SALE, OFF_SHELF]
          default: "ON_SALE"
          example: "ON_SALE"

    # 商品上下架请求模型
    ProductStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [ON_SALE, OFF_SHELF]
          example: "OFF_SHELF"

    # 商品响应模型
    ProductSkuResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1001
        skuCode:
          type: string
          example: "SKU1001"
        spuName:
          type: string
          example: "鹿邑试量传统石磨小磨香油（500ml）"
        price:
          type: number
          format: double
          example: 68.00
        stock:
          type: integer
          example: 800
        status:
          type: string
          enum: [ON_SALE, OFF_SHELF]
          example: "ON_SALE"
        tenantId:
          type: string
          example: "global"
        description:
          type: string
        imageUrl:
          type: string

    # 基础统一响应包
    ApiResponse:
      type: object
      required:
        - code
        - message
        - data
        - timestamp
        - requestId
      properties:
        code:
          type: string
          description: 业务状态码 (00000 代表成功)
          example: "00000"
        message:
          type: string
          description: 响应或错误信息
          example: "操作成功"
        data:
          type: object
          nullable: true
          description: 响应具体载荷
        timestamp:
          type: integer
          format: int64
          description: 毫秒级时间戳
          example: 1725437380000
        requestId:
          type: string
          description: 链路追踪 ID
          example: "req-c8d9e2a1-4321-4b5c"

    # 下单请求模型
    OrderCheckoutRequest:
      type: object
      required:
        - orderSource
        - items
        - receiverAddress
      properties:
        orderSource:
          type: string
          enum: [H5_PRIVATE, DOUYIN, KUAISHOU, B2B_PORTAL]
          description: 订单来源渠道
          example: "H5_PRIVATE"
        remark:
          type: string
          maxLength: 200
          example: "鹿邑于庄特产，多加泡沫箱包装"
        items:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - skuId
              - quantity
              - expectedUnitPrice
            properties:
              skuId:
                type: integer
                format: int64
                example: 100201
              quantity:
                type: integer
                minimum: 1
                example: 2
              expectedUnitPrice:
                type: number
                format: double
                description: 前端校验单价 (单位: 元)
                example: 45.00
        receiverAddress:
          type: object
          required:
            - recipientName
            - phone
            - detailedAddress
          properties:
            recipientName:
              type: string
              example: "张三"
            phone:
              type: string
              pattern: "^1[3-9]\\d{9}$"
              example: "13800000000"
            detailedAddress:
              type: string
              example: "河南省周口市鹿邑县试量镇于庄村"

    # 下单响应模型
    OrderCheckoutResponse:
      type: object
      required:
        - orderNo
        - totalAmount
        - status
      properties:
        orderNo:
          type: string
          example: "ORD202609040001"
        totalAmount:
          type: number
          format: double
          example: 90.00
        status:
          type: string
          enum: [PENDING_PAY, STOCK_CONFIRMED, PROCESSING]
          example: "STOCK_CONFIRMED"
        expireTime:
          type: integer
          format: int64
          description: 订单待支付超时毫秒时间戳
          example: 1725438280000

    # 订单分页响应（GET /orders）
    PageResultOrderSummary:
      type: object
      required:
        - items
        - page
        - pageSize
        - total
        - totalPages
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderSummaryResponse'
        page:
          type: integer
          example: 1
        pageSize:
          type: integer
          example: 10
        total:
          type: integer
          format: int64
          example: 50
        totalPages:
          type: integer
          example: 5

    # 订单列表摘要
    OrderSummaryResponse:
      type: object
      required:
        - orderNo
        - orderSource
        - totalAmount
        - status
        - createdAt
      properties:
        orderNo:
          type: string
          example: "ORD202609040001"
        orderSource:
          type: string
          enum: [H5_PRIVATE, DOUYIN, KUAISHOU, B2B_PORTAL]
          example: "H5_PRIVATE"
        totalAmount:
          type: number
          format: double
          example: 90.00
        status:
          type: string
          enum: [PENDING_PAY, STOCK_CONFIRMED, PROCESSING, CANCELLED, COMPLETED]
          example: "STOCK_CONFIRMED"
        fulfillmentStatus:
          type: string
          enum: [PENDING, PICKING, READY, SHIPPED, ABNORMAL]
          example: "READY"
        recipientName:
          type: string
          example: "张三"
        createdAt:
          type: string
          format: date-time
          example: "2026-09-04T19:30:00"

    # 订单明细行
    OrderItemResponse:
      type: object
      required:
        - skuId
        - quantity
        - unitPrice
        - subtotal
      properties:
        skuId:
          type: integer
          format: int64
          example: 100201
        quantity:
          type: integer
          example: 2
        unitPrice:
          type: number
          format: double
          example: 45.00
        subtotal:
          type: number
          format: double
          example: 90.00

    # 订单详情
    OrderDetailResponse:
      type: object
      required:
        - orderNo
        - orderSource
        - totalAmount
        - status
        - items
      properties:
        orderNo:
          type: string
          example: "ORD202609040001"
        orderSource:
          type: string
          enum: [H5_PRIVATE, DOUYIN, KUAISHOU, B2B_PORTAL]
          example: "H5_PRIVATE"
        totalAmount:
          type: number
          format: double
          example: 90.00
        status:
          type: string
          enum: [PENDING_PAY, STOCK_CONFIRMED, PROCESSING, CANCELLED, COMPLETED]
          example: "STOCK_CONFIRMED"
        fulfillmentStatus:
          type: string
          enum: [PENDING, PICKING, READY, SHIPPED, ABNORMAL]
          example: "READY"
        recipientName:
          type: string
          example: "张三"
        recipientPhone:
          type: string
          example: "13800000000"
        detailedAddress:
          type: string
          example: "河南省周口市鹿邑县试量镇于庄村"
        remark:
          type: string
          example: "鹿邑于庄特产，多加泡沫箱包装"
        createdAt:
          type: string
          format: date-time
          example: "2026-09-04T19:30:00"
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemResponse'

    # 农技问答请求模型
    AgriQARequest:
      type: object
      required:
        - question
      properties:
        question:
          type: string
          minLength: 2
          maxLength: 500
          description: 农户或技术人员咨询的问题
          example: "冬小麦在返青期发黄，叶尖有褐色小点，应该打什么药？"
        category:
          type: string
          enum: [DISEASE_PEST, FERTILIZER, POLICY, GENERAL]
          default: "GENERAL"
          description: 问题分类 (病虫害/水肥/政策/通用)
        sessionId:
          type: string
          description: 上下文多轮对话会话 ID
          example: "sess_agri_8812"

    # 农技问答响应模型 (带防幻觉溯源)
    AgriQAResponse:
      type: object
      required:
        - answer
        - citations
      properties:
        answer:
          type: string
          description: DeepSeek 结合召回语料生成的严谨回答
          example: "根据《河南省冬小麦春季田管指南》，该症状多由小麦纹枯病初期与缺氮复合引起。建议在日均气温稳定在10℃以上时喷施井冈霉素或苯醚甲环唑..."
        disclaimer:
          type: string
          example: "本建议仅供农技参考，请严格遵循农药外包装安全间隔期与用量说明。"
        citations:
          type: array
          description: pgvector 语义检索召回的高置信度依据
          items:
            type: object
            required:
              - docTitle
              - chunkText
              - similarityScore
            properties:
              docTitle:
                type: string
                example: "鹿邑县小麦常见真菌病防治规范.pdf"
              pageNumber:
                type: integer
                example: 14
              chunkText:
                type: string
                example: "小麦返青拔节期...叶鞘出现水渍状椭圆形病斑，后期呈云纹状褐斑..."
              similarityScore:
                type: number
                format: float
                example: 0.892

    # 支付沙箱请求模型
    PaymentSandboxPayRequest:
      type: object
      required:
        - channel
        - tradeNo
      properties:
        channel:
          type: string
          enum: [SANDBOX]
          example: "SANDBOX"
        tradeNo:
          type: string
          maxLength: 64
          description: 渠道支付流水号（幂等去重键）
          example: "pay_trade_1725437380"

    # 支付沙箱响应模型
    PaymentSandboxResponse:
      type: object
      required:
        - orderNo
        - status
        - paidAt
      properties:
        orderNo:
          type: string
          example: "ORD202609040001"
        status:
          type: string
          enum: [PROCESSING]
          example: "PROCESSING"
        channel:
          type: string
          example: "SANDBOX"
        tradeNo:
          type: string
          example: "pay_trade_1725437380"
        paidAt:
          type: integer
          format: int64
          description: 支付成功时间（epoch 毫秒）
          example: 1725437380000

    # 经营大盘聚合响应模型
    DashboardSummaryResponse:
      type: object
      required:
        - tenantId
        - totalOrders
        - totalSales
        - trend
        - topProducts
      properties:
        tenantId:
          type: string
          example: "tenant_yuzhuang_001"
        snapshotAt:
          type: integer
          format: int64
          description: 快照时刻（epoch 毫秒）
        totalOrders:
          type: integer
          description: 累计订单量（含已取消）
        totalSales:
          type: number
          format: double
          description: 累计交易额（非 CANCELLED，元）
        todayOrders:
          type: integer
        todaySales:
          type: number
          format: double
        pendingPayOrders:
          type: integer
          description: 待支付锁定订单量（超时自动关单回补）
        readyShipOrders:
          type: integer
          description: 待出库订单量（履约 READY）
        trend:
          type: array
          description: 近 7 日（含今日，升序，空日补零）
          items:
            type: object
            properties:
              date:
                type: string
                format: date
              orderCount:
                type: integer
              salesAmount:
                type: number
                format: double
        topProducts:
          type: array
          description: 商品销量 TOP（非 CANCELLED 订单明细）
          items:
            type: object
            properties:
              skuId:
                type: integer
                format: int64
              spuName:
                type: string
              quantity:
                type: integer
              salesAmount:
                type: number
                format: double

    # 知识库文档元信息（t_knowledge_chunk 聚合）
    KnowledgeDocItem:
      type: object
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: "yuzhuang_wheat_guide"
        tenantId:
          type: string
          example: "tenant_yuzhuang_001"
        tenantName:
          type: string
          example: "鹿邑试量镇于庄村股份经济合作社"
        source:
          type: string
          example: "yuzhuang_wheat_guide.txt"
        category:
          type: string
          example: "GENERAL"
        chunks:
          type: integer
          example: 24
        status:
          type: string
          enum: [READY]
          example: "READY"
        createdAt:
          type: string
          format: date-time

    KnowledgeUploadResponse:
      type: object
      properties:
        title:
          type: string
        tenantId:
          type: string
        category:
          type: string
        chunks:
          type: integer
        embeddingMode:
          type: string
          enum: [Mock, Real]
          description: 未配置 Embedding 密钥时自动 Mock（离线可跑）

    KnowledgeDeleteRequest:
      type: object
      required: [tenantId, title]
      properties:
        tenantId:
          type: string
          maxLength: 64
        title:
          type: string
          maxLength: 255

    KnowledgeDeleteResponse:
      type: object
      properties:
        deleted:
          type: integer
          description: 已删除的切片行数

  responses:
    StandardErrorResponse:
      description: 业务异常标准返回
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
