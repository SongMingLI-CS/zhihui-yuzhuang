# ============================================================
# 智汇于庄 backend · 主配置
# 默认值为【容器/Docker 网络】语义（见 .clinerules）：
#   - PostgreSQL 主机 rural-revitalization-postgres（容器内）
#   - Redis 主机 rural-revitalization-redis（部署时经 REDIS_HOST 注入；
#     本地开发默认 localhost:6379）
# 本地开发请激活 dev profile（application-dev.yml，宿主 localhost:5433）。
# 所有关键参数均可通过环境变量注入并带有默认值。
# ============================================================
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://${POSTGRES_HOST:rural-revitalization-postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB:rural_revitalization}}
    username: ${POSTGRES_USER:rural_user}
    password: ${POSTGRES_PASSWORD:rural_password}
    hikari:
      pool-name: YuzhuangHikariCP
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1

  # Redis（Redis Streams 可靠事件投递）——容器内主机 rural-revitalization-redis 由
  # REDIS_HOST 注入；本地默认 localhost:6379。连接为惰性建立，无操作不占连接。
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5s
      connect-timeout: 5s

  jackson:
    time-zone: Asia/Shanghai

  # Flyway 版本化迁移：
  #   - enabled=true 时容器/本地 PG 启动即按 db/migration 顺序执行（测试 H2 在 application-test.yml 关闭）；
  #   - baseline-on-migrate 兼容历史无 flyway_schema_history 的存量库（打基线 V1，跳过 V1 重放，直接跑 V2+）。
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration

mybatis-plus:
  global-config:
    banner: false
    db-config:
      id-type: auto
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# ============================================================
# 智汇于庄 Outbox → Redis Streams 可靠投递（调度/幂等旋钮）
# enabled=false 时禁用后台 Sweeper/消费者/Stream 监听（测试环境隔离）。
# ============================================================
yuzhuang:
  # ---- 运行环境与演示开关（生产安全边界唯一入口）----
  # app-env: production/prod 为生产；dev/local/demo/test 为非生产。
  # demo.enabled: 必须显式打开才允许演示账号自举与演示灌数；生产强制 false 并在启动校验中拒绝。
  app-env: ${APP_ENV:dev}
  demo:
    enabled: ${DEMO_MODE:false}

  auth:
    # 开发默认密钥仅用于本地/演示；生产缺少高熵 AUTH_JWT_SECRET 时由 ProductionSafetyValidator 拒绝启动。
    secret: ${AUTH_JWT_SECRET:yuzhuang-demo-jwt-secret-0123456789abcdef}
    expire-minutes: ${AUTH_JWT_EXPIRE_MINUTES:120}
    # 会话 Cookie：B 端浏览器登录优先使用 HttpOnly Cookie（写接口走 CSRF 双提交校验）。
    session-cookie:
      enabled: ${AUTH_SESSION_COOKIE_ENABLED:true}
      name: ${AUTH_SESSION_COOKIE_NAME:yz_session}
      # 生产必须为 true（HTTPS）；非生产默认 false 以便 http://localhost 调试。
      secure: ${AUTH_SESSION_COOKIE_SECURE:false}
      same-site: ${AUTH_SESSION_COOKIE_SAME_SITE:Lax}
      domain: ${AUTH_SESSION_COOKIE_DOMAIN:}
    csrf:
      enabled: ${AUTH_CSRF_ENABLED:true}
      header-name: ${AUTH_CSRF_HEADER_NAME:X-CSRF-Token}
      cookie-name: ${AUTH_CSRF_COOKIE_NAME:yz_csrf}
  outbox:
    enabled: ${OUTBOX_ENABLED:true}
    scan-interval-ms: ${OUTBOX_SCAN_INTERVAL_MS:2000}
    batch-size: ${OUTBOX_BATCH_SIZE:50}
    max-retry: ${OUTBOX_MAX_RETRY:5}
    # 发布端租约：多实例并发下单事件仅一个实例发布；认领后崩溃由租约到期自动接管
    lease-seconds: ${OUTBOX_LEASE_SECONDS:60}
    instance-id: ${OUTBOX_INSTANCE_ID:}

  # 订单支付超时与超时关单（PAY_TIMEOUT 取消 + 幂等库存回补）
  order:
    payment-timeout-minutes: ${ORDER_PAYMENT_TIMEOUT_MINUTES:30}
  order-close:
    enabled: ${ORDER_CLOSE_ENABLED:true}
    scan-interval-ms: ${ORDER_CLOSE_SCAN_INTERVAL_MS:60000}
    initial-delay-ms: ${ORDER_CLOSE_INITIAL_DELAY_MS:15000}
    batch-size: ${ORDER_CLOSE_BATCH_SIZE:50}

  # ============================================================
  # 外部销售渠道（阶段 G）：默认全部关闭且无密钥。
  # 未配置时 /api/v1/channels/{channel}/notify 明确返回 503 + C5003，
  # 不接收任何回调、也不在文档中宣称“已接入”。
  # 拿到真实凭证后：设置 enabled=true 并注入 secret（仅环境变量/secret，勿入库前端）。
  # ============================================================
  channel:
    douyin:
      enabled: ${CHANNEL_DOUYIN_ENABLED:false}
      secret: ${CHANNEL_DOUYIN_SECRET:}
    kuaishou:
      enabled: ${CHANNEL_KUAISHOU_ENABLED:false}
      secret: ${CHANNEL_KUAISHOU_SECRET:}
    b2b:
      enabled: ${CHANNEL_B2B_ENABLED:false}
      secret: ${CHANNEL_B2B_SECRET:}

logging:
  level:
    com.yuzhuang: info
  pattern:
    level: "%5p [%X{requestId:-}] [%X{tenantId:-}]"
