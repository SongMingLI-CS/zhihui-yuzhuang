# 智汇于庄 H5 · 容器内 nginx 静态托管
#
# 网关将 /h5/ 原样转发到本容器（不剥离前缀），因此所有路径均带 /h5/ 前缀。
# 产物位于 /usr/share/nginx/html/h5（见 Dockerfile），index.html 引用
# base='/h5/' 的哈希资源 /h5/assets/*。
#
# 策略：
#   - /h5/assets/*   哈希资源：长缓存（immutable）
#   - /h5/*.svg 等 public 静态资源：10 天短缓存（favicon / 图标，名称不带哈希）
#   - /h5/*          入口 HTML：no-cache（避免网关/浏览器长期缓存过期页面）
#   - /healthz       容器存活探针（可选，供 compose healthcheck）
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json
        image/svg+xml application/xml font/woff2;

    # Vite 产物（文件名含内容哈希）-> 长缓存
    location /h5/assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # public/ 静态资源（favicon.svg 等，文件名不含哈希）-> 短缓存
    location ~* ^/h5/[^/]+\.(svg|png|ico|webp)$ {
        try_files $uri =404;
        expires 10d;
        add_header Cache-Control "public, max-age=864000";
    }

    # 入口 HTML（/h5/、/h5/index.html）-> 每次回源校验
    location /h5/ {
        try_files $uri $uri/ /h5/index.html;
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 存活探针
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # 其余一律 404
    location / {
        default_type text/plain;
        return 404 'not found';
    }
}
