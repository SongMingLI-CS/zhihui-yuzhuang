name: Frontend quality
on:
  push:
    paths: ['web/**', 'h5/**', '.github/workflows/frontend-quality.yml']
  pull_request:
    paths: ['web/**', 'h5/**', '.github/workflows/frontend-quality.yml']
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: "web/package-lock.json\nh5/package-lock.json" }
      - run: npm ci
        working-directory: web
      - run: npm ci
        working-directory: h5
      - run: npm run lint && npm run typecheck && npm test && npm run build
        working-directory: web
      - run: npm run lint && npm run typecheck && npm test && npm run build
        working-directory: h5
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: web/playwright-report }
