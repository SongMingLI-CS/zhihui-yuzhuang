# 智汇于庄 · Nginx 统一接入网关
#
# 路由约定（容器网络 rural-network 内以服务名互访）：
#   /api/*  -> backend:8080   (Spring Boot)  业务后端（已接入）
#   /ai/*   -> ai-service:8000 (FastAPI)     AI/RAG 服务（已接入）
#   /b/*    -> web:3000       (Next.js)      B 端数据大屏（已接入）
#   /h5/*   -> h5:80          (静态 H5)      C 端消费页（已接入）
#
# 采用 resolver(127.0.0.11) + 变量式 proxy_pass：DNS 在请求到达时动态解析，
# 使网关可先于后端/ai 服务启动；上游未就绪仅返回 502，不影响网关容器运行。
# 反代开启 HTTP/1.1 keepalive（proxy_http_version 1.1 + Connection ""）。

resolver 127.0.0.11 valid=30s ipv6=off;

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    # ---- 健康/状态页 ----
    location = / {
        default_type text/html;
        return 200 '<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
            <title>智汇于庄 · 网关</title></head>
            <body style="font-family:sans-serif;margin:2rem">
            <h2>智汇于庄 · 网关运行中</h2>
            <ul>
            <li><code>/api</code> &rarr; backend (Spring Boot) [已接入]</li>
            <li><code>/ai</code>  &rarr; ai-service (FastAPI)  [已接入]</li>
            <li><code>/b</code>   &rarr; web (Next.js B端)      [已接入]</li>
            <li><code>/h5</code>  &rarr; h5 (C端轻量页)         [已接入]</li>
            </ul></body></html>';
    }

    location = /healthz {
        default_type text/plain;
        return 200 'ok';
    }

    # ---- 业务后端 API ----
    location /api/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- AI 服务（RAG / 多智能体营销生成） ----
    location /ai/ {
        set $ai_upstream http://ai-service:8000;
        proxy_pass $ai_upstream;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 大模型多 Agent 编排可能耗时较长，放宽读写超时
        proxy_connect_timeout 30s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---- B 端数据大屏 / 管理后台 ----
    location /b/ {
        set $web_upstream http://web:3000;
        proxy_pass $web_upstream;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- C 端轻量 H5（静态托管：完整 /h5/ 前缀透传给容器内 nginx） ----
    location /h5/ {
        set $h5_upstream http://h5:80;
        proxy_pass $h5_upstream;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- 其余路径统一提示 ----
    location / {
        default_type text/html;
        return 404 '<!doctype html><html lang="zh-CN"><body style="font-family:sans-serif;margin:2rem">
            <h3>404 · 未知路由</h3><p>智汇于庄网关当前仅暴露 / /api/ /ai/ /b/ /h5/。</p></body></html>';
    }
}
